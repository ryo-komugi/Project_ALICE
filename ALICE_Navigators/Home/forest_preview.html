<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07110d">
    <title>森を進む演出 | Project ALICE Preview</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body {
            background: #07110d;
            color: #f0f5e9;
            font-family: "BIZ UDPGothic", "Yu Gothic", Meiryo, sans-serif;
        }
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            background: #08130e;
        }
        .forest-backdrop {
            position: absolute;
            inset: -5%;
            background: url("/home/assets/forest_preview_background.png") center / cover no-repeat;
            transform: scale(1.02);
            will-change: transform, filter;
        }
        .scene::after {
            position: absolute;
            z-index: 1;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(1, 7, 4, .32), transparent 35% 65%, rgba(1, 7, 4, .32)),
                linear-gradient(180deg, rgba(2, 8, 5, .18), transparent 35%, rgba(2, 8, 5, .38));
            content: "";
            pointer-events: none;
        }
        .foreground {
            position: absolute;
            z-index: 2;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }
        .foliage-left, .foliage-right {
            transform-box: view-box;
            transform-origin: center;
            will-change: transform;
        }
        .foliage-left { transform-origin: 0 50%; }
        .foliage-right { transform-origin: 100% 50%; }
        .label {
            position: absolute;
            z-index: 3;
            right: 20px;
            top: 18px;
            padding: 9px 13px;
            border: 1px solid rgba(234, 245, 219, .3);
            border-radius: 999px;
            background: rgba(3, 12, 7, .58);
            color: rgba(245, 251, 237, .85);
            font-size: 12px;
            letter-spacing: .12em;
            backdrop-filter: blur(8px);
        }
        .caption {
            position: absolute;
            z-index: 3;
            left: 50%;
            bottom: clamp(32px, 9vh, 84px);
            width: max-content;
            max-width: calc(100% - 32px);
            margin: 0;
            padding: 12px 20px;
            transform: translateX(-50%);
            border: 1px solid rgba(220, 237, 197, .22);
            border-radius: 999px;
            background: rgba(4, 12, 7, .42);
            color: #edf5df;
            font-size: clamp(13px, 2.2vw, 18px);
            letter-spacing: .12em;
            text-align: center;
            text-shadow: 0 2px 12px #000;
            backdrop-filter: blur(7px);
            animation: caption-in .8s ease .4s both;
        }
        .replay {
            position: absolute;
            z-index: 4;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            padding: 8px 15px;
            border: 1px solid rgba(226, 240, 206, .3);
            border-radius: 999px;
            background: rgba(4, 12, 7, .65);
            color: #f1f6e9;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        .playing .forest-backdrop { animation: walk-forward 5.4s cubic-bezier(.45, .02, .7, .98) both; }
        .playing .foliage-left { animation: brush-left 5.4s cubic-bezier(.36, .03, .65, 1) both; }
        .playing .foliage-right { animation: brush-right 5.4s cubic-bezier(.36, .03, .65, 1) both; }
        .playing .caption { animation: caption-in .8s ease .5s both, caption-out .45s ease 4.8s both; }

        @keyframes walk-forward {
            0% { transform: scale(1.02) translateY(0); filter: brightness(.78) saturate(.9); }
            18% { transform: scale(1.07) translateY(1%); filter: brightness(.9) saturate(.96); }
            100% { transform: scale(1.3) translateY(5%); filter: brightness(1.08) saturate(1.08); }
        }
        @keyframes brush-left {
            0%, 12% { transform: translate(0, 0) rotate(0); }
            38% { transform: translate(-3.5vw, 1.4vh) rotate(-2deg); }
            68% { transform: translate(-11vw, 2vh) rotate(-5deg); }
            100% { transform: translate(-17vw, 3vh) rotate(-7deg); }
        }
        @keyframes brush-right {
            0%, 12% { transform: translate(0, 0) rotate(0); }
            38% { transform: translate(3.5vw, 1.4vh) rotate(2deg); }
            68% { transform: translate(11vw, 2vh) rotate(5deg); }
            100% { transform: translate(17vw, 3vh) rotate(7deg); }
        }
        @keyframes caption-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes caption-out { to { opacity: 0; transform: translate(-50%, -6px); } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; }
        }
    </style>
</head>
<body>
    <main class="scene playing" id="scene" aria-label="森の中を進み、枝葉をかき分ける演出のプレビュー">
        <div class="forest-backdrop" aria-hidden="true"></div>
        <svg class="foreground" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <defs>
                <linearGradient id="bark" x1="0" x2="1" y1="0" y2="1">
                    <stop offset="0" stop-color="#07100b" />
                    <stop offset=".55" stop-color="#17231a" />
                    <stop offset="1" stop-color="#050b07" />
                </linearGradient>
                <radialGradient id="leaf">
                    <stop offset="0" stop-color="#47723d" />
                    <stop offset="1" stop-color="#102319" />
                </radialGradient>
            </defs>
            <g class="foliage-left">
                <path d="M0 0 C130 36 95 146 155 225 C218 309 134 398 201 489 C250 556 203 691 278 900 L0 900Z" fill="url(#bark)" />
                <path d="M15 155 C130 168 195 90 319 59 M67 370 C171 372 223 293 365 266 M82 548 C186 535 225 466 330 441" fill="none" stroke="#0a140d" stroke-width="43" stroke-linecap="round" />
                <path d="M0 0 C177 20 286 5 421 92 C319 59 248 103 193 153 C117 143 73 105 0 117Z" fill="#0c1b11" />
                <path d="M0 170 C111 156 213 211 297 258 C207 243 136 286 59 309 C41 260 22 221 0 216Z" fill="#142619" />
                <path d="M0 0 C155 20 270 18 421 92 M0 175 C104 165 198 216 297 258 M5 335 C116 333 195 382 284 421" fill="none" stroke="#101d13" stroke-width="24" stroke-linecap="round" />
                <g fill="url(#leaf)">
                    <ellipse cx="90" cy="45" rx="93" ry="55" /><ellipse cx="248" cy="38" rx="105" ry="46" />
                    <ellipse cx="53" cy="238" rx="77" ry="54" /><ellipse cx="225" cy="191" rx="88" ry="44" />
                    <ellipse cx="73" cy="456" rx="96" ry="58" /><ellipse cx="230" cy="390" rx="84" ry="53" />
                    <ellipse cx="20" cy="710" rx="110" ry="90" /><ellipse cx="170" cy="828" rx="132" ry="73" />
                </g>
                <g fill="#548347" opacity=".55">
                    <ellipse cx="74" cy="80" rx="56" ry="14" transform="rotate(-24 74 80)" />
                    <ellipse cx="273" cy="85" rx="64" ry="16" transform="rotate(18 273 85)" />
                    <ellipse cx="120" cy="310" rx="59" ry="15" transform="rotate(-18 120 310)" />
                    <ellipse cx="48" cy="550" rx="66" ry="17" transform="rotate(22 48 550)" />
                </g>
            </g>
            <g transform="translate(1600 0) scale(-1 1)">
              <g class="foliage-right">
                <path d="M0 0 C130 36 95 146 155 225 C218 309 134 398 201 489 C250 556 203 691 278 900 L0 900Z" fill="url(#bark)" />
                <path d="M15 155 C130 168 195 90 319 59 M67 370 C171 372 223 293 365 266 M82 548 C186 535 225 466 330 441" fill="none" stroke="#0a140d" stroke-width="43" stroke-linecap="round" />
                <path d="M0 0 C177 20 286 5 421 92 C319 59 248 103 193 153 C117 143 73 105 0 117Z" fill="#0c1b11" />
                <path d="M0 170 C111 156 213 211 297 258 C207 243 136 286 59 309 C41 260 22 221 0 216Z" fill="#142619" />
                <path d="M0 0 C155 20 270 18 421 92 M0 175 C104 165 198 216 297 258 M5 335 C116 333 195 382 284 421" fill="none" stroke="#101d13" stroke-width="24" stroke-linecap="round" />
                <g fill="url(#leaf)">
                    <ellipse cx="90" cy="45" rx="93" ry="55" /><ellipse cx="248" cy="38" rx="105" ry="46" />
                    <ellipse cx="53" cy="238" rx="77" ry="54" /><ellipse cx="225" cy="191" rx="88" ry="44" />
                    <ellipse cx="73" cy="456" rx="96" ry="58" /><ellipse cx="230" cy="390" rx="84" ry="53" />
                    <ellipse cx="20" cy="710" rx="110" ry="90" /><ellipse cx="170" cy="828" rx="132" ry="73" />
                </g>
                <g fill="#548347" opacity=".55">
                    <ellipse cx="74" cy="80" rx="56" ry="14" transform="rotate(-24 74 80)" />
                    <ellipse cx="273" cy="85" rx="64" ry="16" transform="rotate(18 273 85)" />
                    <ellipse cx="120" cy="310" rx="59" ry="15" transform="rotate(-18 120 310)" />
                    <ellipse cx="48" cy="550" rx="66" ry="17" transform="rotate(22 48 550)" />
                </g>
              </g>
            </g>
        </svg>
        <span class="label">演出プレビュー</span>
        <p class="caption">葉を押し分けて、森の奥へ…</p>
        <button class="replay" type="button" id="replay">もう一度見る</button>
    </main>
    <script>
        const scene = document.getElementById("scene");
        document.getElementById("replay").addEventListener("click", () => {
            scene.classList.remove("playing");
            void scene.offsetWidth;
            scene.classList.add("playing");
        });
    </script>
</body>
</html>
