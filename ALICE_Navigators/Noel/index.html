<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noel | Project ALICE</title>
    <style>
        /* フォント */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            background-color: #060913;
            background-image:
                linear-gradient(to bottom, rgba(6, 9, 19, 0.88), rgba(6, 9, 19, 0.82)),
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0, transparent 50%),
                url("/noel/assets/alice_background.png");
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            color: #fff;
        }

        /* 背景を薄くするためのオーバーレイ */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.06), transparent 55%);
            z-index: 0;
            pointer-events: none;
        }

        /* タイトルバー */
        .header {
            font-family: 'BIZ UDPGothic', 'BIZ UDPゴシック', 'Poppins', sans-serif;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            min-height: 82px;
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.82);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.32);
            box-shadow: 0 10px 32px rgba(2, 6, 23, 0.35);
            font-size: 32px;
            font-weight: 900;
            color: #e0f2fe;
            position: fixed;
            top: 0;
            right: 0;
            z-index: 100;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .header-title {
            grid-column: 2;
            text-align: center;
            background: linear-gradient(90deg, #7dd3fc, #f0f9ff 55%, #fcd34d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        .header-spacer {
            grid-column: 3;
            width: 140px; /* バランス用ダミー幅 */
        }

        .back-nav {
            grid-column: 1;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.45);
            border-radius: 9999px;
            color: #7dd3fc;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-shadow: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(2, 6, 23, 0.4);
        }
        .back-nav svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            transition: transform 0.2s ease;
        }
        .back-nav:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
        }
        .back-nav:hover svg {
            transform: translateX(-3px);
        }

        .back-nav-text-mobile {
            display: none;
        }

        @media (max-width: 680px) {
            .header {
                min-height: 64px;
                padding: 10px 14px;
            }
            .header-title {
                font-size: 19px;
                letter-spacing: -0.02em;
            }
            .header-spacer {
                display: none;
            }
            .back-nav {
                padding: 6px 12px;
                font-size: 11px;
                gap: 5px;
            }
            .back-nav svg {
                width: 14px;
                height: 14px;
            }
            .back-nav-text-pc {
                display: none;
            }
            .back-nav-text-mobile {
                display: inline;
            }
        }

        /* メインコンテンツ */
        .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(280px, 400px) minmax(0, 1fr);
            align-items: center;
            gap: clamp(24px, 4vw, 52px);
            width: min(1100px, calc(100% - 40px));
            margin: 130px auto 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: clamp(22px, 4vw, 40px);
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .image-container { position: relative; width: 100%; }

        .character-art {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }

        .content { min-width: 0; }

        .content_title {
            margin: 0 0 4px;
            font-size: 18px;
            font-weight: 600;
        }

        .character-name {
            margin: 0 0 20px;
            font-weight: 600;
            font-size: 48px;
            line-height: 1.2;
        }

        /* ファイルアップロードボタン */
        input[type="file"] {
            display: none;
        }

        #file-name {
            min-height: 22px;
            margin: 10px 0 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 198, 255, 0.3);
        }

        .custom-file-upload:hover {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            box-shadow: 0 6px 15px rgba(0, 198, 255, 0.5);
        }
        .upload-button {
            display: inline-block;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 198, 255, 0.3);
            border: none;
            margin-top: 15px; /* 余白を調整 */
        }

        .upload-button:hover {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            box-shadow: 0 6px 15px rgba(0, 198, 255, 0.5);
        }

        .upload-button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .processing-status {
            margin: 22px auto 0;
            max-width: 480px;
            text-align: left;
        }

        .processing-label {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 7px;
            font-size: 14px;
        }

        .progress-track {
            height: 12px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.25);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #00c6ff, #7b7dff);
            transition: width 0.4s ease;
        }

        /* 変換結果 */
        #output {
            margin: 0;
            padding: 15px;
            border-radius: 8px;
            min-height: 80px;
            max-height: 42vh;
            overflow: auto;
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 14px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .result-title { margin: 22px 0 10px; font-size: 20px; }

        /* スクロールバーのカスタマイズ（オプション） */
        #output::-webkit-scrollbar {
            width: 8px;
        }

        #output::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.5); /* スクロールバーの色 */
            border-radius: 4px;
        }

        #output::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1); /* スクロールバーの背景 */
        }

        /* ローディングスピナー */
        .spinner {
            display: none; /* 初期状態は非表示 */
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #007bff; /* 青系の色 */
            border-radius: 50%;
            animation: spin 1s linear infinite;

            /* Noel の中央に配置 */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* アニメーション定義 */
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @media (max-width: 760px) {
            .container {
                grid-template-columns: 1fr;
                width: min(620px, calc(100% - 28px));
                margin-top: 108px;
                gap: 24px;
            }
            .image-container { width: min(100%, 360px); margin: 0 auto; }
        }

        @media (max-width: 480px) {
            .header { min-height: 68px; font-size: 25px; }
            .container { margin-top: 88px; padding: 18px; }
            .character-name { font-size: 40px; }
            .custom-file-upload, .upload-button { width: 100%; padding: 12px 16px; }
        }
    </style>
</head>
<body>

    <!-- タイトルバー -->
    <header class="header">
        <a href="/rabbit-hole" class="back-nav" title="ポータルへ戻る">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
            <span class="back-nav-text-pc">Rabbit-Hole へ戻る</span>
            <span class="back-nav-text-mobile">戻る</span>
        </a>
        <h1 class="header-title">PROJECT ALICE</h1>
        <div class="header-spacer" aria-hidden="true"></div>
    </header>

    <!-- メインコンテンツ -->
    <main class="container">
        <div class="image-container">
            <img id="Noel" class="character-art" src="/noel/assets/ai_character_noel.png" alt="Noel">
            <div id="loading-spinner" class="spinner"></div>
        </div>
        <section class="content">
            <h1 class="content_title">音声自動文字起こしAI</h1>
            <h2 class="character-name">Noel</h2>

            <form id="uploadForm">
                <label for="audioFile" class="custom-file-upload">音声ファイルを選択</label>
                <input type="file" id="audioFile" accept=".mp3,.m4a,.wav,audio/mpeg,audio/mp4,audio/wav" onchange="fileSelected()">
                <p id="file-name" aria-live="polite">選択されていません</p>
                <button type="button" class="upload-button" onclick="uploadAudio()">アップロードして文字起こし</button>
            </form>

            <div class="processing-status" aria-live="polite">
                <div class="processing-label">
                    <span id="progress-stage">待機中</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-track" role="progressbar" aria-label="文字起こしの進捗"
                     aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>

            <h2 class="result-title">文字起こし結果</h2>
            <div id="output" aria-live="polite">ここにテキストが表示されます</div>
        </section>
    </main>

    <script>
        const API_ROOT = "/noel/api";
        const fileInput = document.getElementById("audioFile");
        const outputElement = document.getElementById("output");
        const spinner = document.getElementById("loading-spinner");
        const uploadButton = document.querySelector(".upload-button");
        const progressStage = document.getElementById("progress-stage");
        const progressPercent = document.getElementById("progress-percent");
        const progressTrack = document.getElementById("progress-track");
        const progressBar = document.getElementById("progress-bar");

        function fileSelected() {
            const file = fileInput.files[0];
            document.getElementById("file-name").innerText = file ? file.name : "選択されていません";
        }

        function setBusy(busy) {
            spinner.style.display = busy ? "block" : "none";
            uploadButton.disabled = busy;
            uploadButton.setAttribute("aria-busy", String(busy));
        }

        function showProgress(progress, fallbackStage = "処理中") {
            const percent = Math.max(0, Math.min(100, Number(progress?.percent) || 0));
            progressStage.innerText = progress?.stage || fallbackStage;
            progressPercent.innerText = `${percent}%`;
            progressBar.style.width = `${percent}%`;
            progressTrack.setAttribute("aria-valuenow", String(percent));
        }

        async function pollJob(statusUrl, transcriptUrl) {
            let hasLiveTranscript = false;
            while (true) {
                const response = await fetch(statusUrl, { credentials: "same-origin", cache: "no-store" });
                const job = await response.json();
                if (!response.ok) throw new Error(job.detail || "ジョブの状態を取得できませんでした");
                showProgress(job.progress, job.current_step || "処理待ち");
                const liveResponse = await fetch(`${statusUrl}/live-transcript`, {
                    credentials: "same-origin", cache: "no-store"
                });
                if (liveResponse.ok && liveResponse.status !== 204) {
                    const liveText = await liveResponse.text();
                    if (liveText) {
                        hasLiveTranscript = true;
                        outputElement.innerText = liveText;
                        outputElement.style.textAlign = "left";
                        outputElement.scrollTop = outputElement.scrollHeight;
                    }
                }
                if (job.status === "COMPLETED") {
                    const result = await fetch(transcriptUrl, { credentials: "same-origin", cache: "no-store" });
                    if (!result.ok) throw new Error("文字起こし結果を取得できませんでした");
                    outputElement.innerText = await result.text();
                    outputElement.style.textAlign = "left";
                    showProgress({ stage: "完了", percent: 100 });
                    return;
                }
                if (job.status === "FAILED") throw new Error(job.error_message || "処理に失敗しました");
                if (!hasLiveTranscript) {
                    outputElement.innerText = "文字起こし結果を待っています...";
                    outputElement.style.textAlign = "center";
                }
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
        }

        async function uploadAudio() {
            const file = fileInput.files[0];
            if (!file) {
                alert("音声ファイルを選択してください。");
                return;
            }
            if (file.size > 100 * 1024 * 1024) {
                alert("ファイルは100 MiB以下にしてください。");
                return;
            }

            setBusy(true);
            showProgress({ stage: "音声をアップロード中", percent: 0 });
            outputElement.innerText = "アップロード中...";
            outputElement.style.textAlign = "center";
            try {
                const sessionResponse = await fetch(`${API_ROOT}/session`, { credentials: "same-origin", cache: "no-store" });
                if (!sessionResponse.ok) throw new Error("ブラウザーセッションを開始できませんでした");
                const formData = new FormData();
                formData.append("audio", file);
                const response = await fetch(`${API_ROOT}/transcribe`, {
                    method: "POST",
                    body: formData,
                    credentials: "same-origin",
                    cache: "no-store"
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "アップロードに失敗しました");
                await pollJob(data.status_url, data.transcript_url);
            } catch (error) {
                outputElement.innerText = error.message;
                outputElement.style.textAlign = "center";
            } finally {
                setBusy(false);
            }
        }
    </script>
</body>
</html>
