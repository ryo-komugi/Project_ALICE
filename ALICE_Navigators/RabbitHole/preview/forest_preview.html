<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rabbit-Hole 森の通過演出プレビュー</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #e7f2df;
      background: #07100c;
      font-family: "BIZ UDPGothic", "Yu Gothic", sans-serif;
    }
    main { width: min(1100px, 100%); }
    h1 { margin: 0 0 14px; font-size: clamp(18px, 3vw, 26px); font-weight: 500; }
    .frame {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      isolation: isolate;
      background: #06100d;
      box-shadow: 0 20px 80px #000b;
    }
    .scene {
      position: absolute;
      inset: -12%;
      background: linear-gradient(180deg, #06100d22, #03100b25), url("forest_scene.png") center / cover no-repeat;
      transform-origin: 56% 44%;
      animation: camera-advance 5.2s cubic-bezier(.2,.65,.3,1) forwards;
      will-change: transform, filter;
    }
    .mist {
      position: absolute;
      z-index: 1;
      inset: 25% -10% -20%;
      background: radial-gradient(ellipse at 50% 30%, #7be9e233, transparent 55%);
      filter: blur(22px);
      animation: mist-breathe 3s ease-in-out infinite alternate;
    }
    .tunnel {
      position: absolute;
      z-index: 2;
      inset: -8%;
      background: url("rabbit_burrow_inside.png") center / cover no-repeat;
      opacity: 0;
      transform: scale(1);
      transform-origin: 50% 45%;
      filter: brightness(1);
      transition: opacity .9s ease;
      will-change: transform, filter, opacity;
      pointer-events: none;
    }
    .caption {
      position: absolute;
      z-index: 4;
      right: 16px;
      bottom: 16px;
      left: 16px;
      margin: 0;
      text-align: center;
      font-size: clamp(13px, 2vw, 18px);
      letter-spacing: .16em;
      text-shadow: 0 2px 12px #000;
      animation: caption-in 1s 1.1s both, caption-out .6s 3.5s forwards;
    }
    .controls { display: flex; align-items: center; gap: 14px; margin-top: 14px; color: #b8c8b7; font-size: 13px; }
    button {
      padding: 9px 16px;
      border: 1px solid #77936f;
      border-radius: 999px;
      color: inherit;
      background: #102016;
      font: inherit;
      cursor: pointer;
    }
    @keyframes camera-advance {
      0% { transform: scale(1.01); filter: brightness(1); }
      25% { transform: scale(1.22); filter: brightness(.95); }
      56% { transform: scale(2.1); filter: brightness(.78); }
      82% { transform: scale(4.3); filter: brightness(.55); }
      100% { transform: scale(8); filter: brightness(.22); }
    }
    @keyframes mist-breathe { to { opacity: .45; transform: translateY(-2%); } }
    @keyframes caption-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes caption-out { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Rabbit-Hole 森の通過演出</h1>
    <section class="frame" id="frame" aria-label="森の木々をかき分けながら小道を進むアニメーション">
      <div class="scene"></div>
      <div class="mist"></div>
      <div class="tunnel"></div>
      <p class="caption">木々をかき分け、森の奥へ…</p>
    </section>
    <div class="controls">
      <button id="replay" type="button">もう一度見る</button>
      <span>森から巣穴へ入り、その先もズームし続けるローカルプレビューです。アプリ本体にはまだ適用していません。</span>
    </div>
  </main>
  <script>
    const scene = document.querySelector(".scene");
    const tunnel = document.querySelector(".tunnel");
    const caption = document.querySelector(".caption");
    const journeyDuration = 5200;
    let journeyStart = performance.now();

    function animateJourney(now) {
      const elapsed = now - journeyStart;
      const fadeStart = 4200;
      const entrance = Math.max(0, Math.min(1, (elapsed - fadeStart) / (journeyDuration - fadeStart)));

      tunnel.style.opacity = String(entrance);
      scene.style.opacity = String(1 - entrance);

      if (elapsed >= journeyDuration) {
        const timeInside = elapsed - journeyDuration;
        const depthScale = Math.exp(timeInside * 0.00016);
        tunnel.style.transform = `scale(${depthScale})`;
        tunnel.style.filter = `brightness(${Math.max(0.12, 1 - timeInside / 50000)})`;
      }

      requestAnimationFrame(animateJourney);
    }
    requestAnimationFrame(animateJourney);

    document.getElementById("replay").addEventListener("click", () => {
      journeyStart = performance.now();
      tunnel.style.opacity = "0";
      tunnel.style.transform = "scale(1)";
      tunnel.style.filter = "brightness(1)";
      scene.style.opacity = "1";
      scene.style.animation = "none";
      caption.style.animation = "none";
      void scene.offsetWidth;
      scene.style.animation = "";
      caption.style.animation = "";
    });
  </script>
</body>
</html>
